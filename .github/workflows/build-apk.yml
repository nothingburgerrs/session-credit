name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhoneKeys.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneKeys-apk
          path: PhoneKeys.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PhoneKeys (latest build)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: PhoneKeys.apk
          body: |
            Open this page on your phone and tap **PhoneKeys.apk** to download it.
            Built from ${{ github.sha }}.
