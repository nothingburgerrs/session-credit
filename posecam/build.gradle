plugins {
    id 'com.android.application'
}

android {
    namespace 'com.posecam'
    compileSdk 34

    defaultConfig {
        applicationId 'com.posecam'
        minSdk 29          // Android 10+: saves to Pictures without a storage permission
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
